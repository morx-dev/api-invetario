<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">Sistema de Inventario 💻</span>
        <span class="text-white id="userInfo"></span>
        <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Lista de Productos Disponibles</h2>
        
        <div class="card p-4 shadow-sm">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Artículo</th>
                        <th>Precio</th>
                        <th>Stock Actual</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <tr>
                        <td colspan="5" class="text-center text-muted">Cargando inventario...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Pequeño script de control inicial para asegurar que esté logueado
        const token = localStorage.getItem('token');
        if (!token) {
            // Si intenta entrar directo sin loguearse, lo patitas a la calle al login
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            document.getElementById('userInfo').innerText = `Usuario: ${usuario.email} (${usuario.rol})`;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
