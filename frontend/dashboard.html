<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Inventario</title>
    
    <!-- Estilos de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos de DataTables y Botones -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark px-4">
        <span class="navbar-brand mb-0 h1">Sistema de Inventario</span>
        <span class="text-white" id="userInfo"></span>
        <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Lista de Productos Disponibles</h2>
            <!-- Botón exclusivo para ROL ADMIN -->
            <button id="btnAgregarModal" class="btn btn-primary d-none" onclick="abrirModalCrear()">
                ➕ Agregar Producto
            </button>
        </div>

        <div class="card p-4 shadow-sm">
            <!-- Tabla de datos inicializada desde productos.js -->
            <table id="miTablaProductos" class="table table-hover align-middle w-100">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Artículo</th>
                        <th>Precio</th>
                        <th>Stock Actual</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <tr>
                        <td colspan="5" class="text-center text-muted">Cargando inventario...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Crear / Editar Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalTitulo">Agregar Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" id="prodNombre" class="form-control" required placeholder="Ej. Teclado Mecánico">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio (Q)</label>
                            <input type="number" step="0.01" id="prodPrecio" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" id="prodStock" class="form-control" required placeholder="10">
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="btnGuardar">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de validación de autenticación inicial -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            document.getElementById('userInfo').innerText = `Usuario: ${usuario.email} (${usuario.rol})`;
        }
    </script>

    <!-- jQuery, Bootstrap JS y DataTables CDNs -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <!-- Scripts modulares del cliente -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
