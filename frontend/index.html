<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Login</title>
    
    <!-- CDNs de Fuentes y Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Hoja de estilos custom -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="auth-shell">
        <div class="auth-brand">
            <div>
                <div class="mark">I</div>
                <h1>MOR INDUSTRIES</h1>
                <p>Consulta existencias, precios y movimientos de stock desde un solo panel.</p>
            </div>
            <div class="tag-row">
                <span>Stock en tiempo real</span>
                <span>Roles y permisos</span>
            </div>
        </div>

        <div class="auth-form-panel">
            <h2>Iniciar sesión</h2>
            <p class="subtitle">Ingresa tus credenciales para continuar.</p>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="********">
                </div>
                <button type="submit" class="btn btn-entrar w-100">Entrar al sistema</button>
            </form>
        </div>
    </div>

    <!-- Scripts de la aplicación -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
